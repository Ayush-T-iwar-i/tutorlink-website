<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Dashboard — TutorLink</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="dashboard-header">
  <div class="container">
    <a href="index.html" style="text-decoration:none;">
      <div class="brand"><span class="brand-mark"></span>Tutor<em>Link</em></div>
    </a>
    <div class="header-actions">
      <div class="user-chip">
        <span class="avatar-sm" id="avatarInitials"></span>
        <span id="welcomeText"></span>
      </div>
      <button id="logoutBtn" class="btn btn-outline btn-sm">Log out</button>
    </div>
  </div>
</header>

<main class="dashboard-body">
  <div class="container">

    <div class="eyebrow">Teacher dashboard</div>
    <h1 class="page-title">Welcome back</h1>
    <p class="page-subtitle">Here's what's happening with your teaching profile.</p>

    <div id="profileBanner"></div>

    <div class="panel" id="profileSummary">
      <div class="empty-state">Loading your profile...</div>
    </div>

    <div class="panel">
      <div class="panel-title">Incoming booking requests</div>
      <p class="panel-hint">Accept or decline demo and recurring class requests.</p>
      <div id="bookingsArea"><div class="empty-state">Loading requests...</div></div>
    </div>

  </div>
</main>

<script src="js/api.js"></script>
<script>
  const session = requireLogin('teacher');
  if (session) {
    document.getElementById('welcomeText').textContent = session.user.name;
    document.getElementById('avatarInitials').textContent =
      session.user.name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
  }

  document.getElementById('logoutBtn').addEventListener('click', () => {
    clearSession();
    window.location.href = 'login.html';
  });

  // ---------- Profile summary + completeness banner ----------
  async function loadProfileSummary() {
    const banner = document.getElementById('profileBanner');
    const summary = document.getElementById('profileSummary');

    try {
      const t = await apiRequest(`/api/teachers/by-user/${session.user.id}`);
      const isComplete = t.subjects && t.qualification && t.address && t.latitude;

      if (isComplete) {
        banner.innerHTML = `
          <div class="banner done">
            <div class="banner-text">
              <strong>Your profile is live</strong>
              <span>Students within ${t.travel_radius_km || 5} km of ${t.city || 'your area'} can find you.</span>
            </div>
            <a href="teacher-complete-profile.html" class="btn btn-outline btn-sm">Edit profile</a>
          </div>`;

        const location = [t.address, t.city].filter(Boolean).join(', ');
        summary.innerHTML = `
          <div class="panel-title">Your profile</div>
          <div class="info-grid" style="margin-top:14px;">
            <div class="info-tile"><div class="label">Qualification</div><div class="value">${t.qualification}</div></div>
            <div class="info-tile"><div class="label">Subjects</div><div class="value">${t.subjects}</div></div>
            <div class="info-tile"><div class="label">Fee / hour</div><div class="value">₹${t.fee_per_hour || 0}</div></div>
            <div class="info-tile"><div class="label">Location</div><div class="value">${location}</div></div>
            <div class="info-tile"><div class="label">Travel radius</div><div class="value">${t.travel_radius_km || 5} km</div></div>
            <div class="info-tile"><div class="label">Rating</div><div class="value">★ ${t.rating_avg || 'New'}</div></div>
          </div>`;
      } else {
        banner.innerHTML = `
          <div class="banner">
            <div class="banner-text">
              <strong>Your profile isn't complete yet</strong>
              <span>Add your qualifications and location — students can't find you until this is done.</span>
            </div>
            <a href="teacher-complete-profile.html" class="btn btn-accent btn-sm">Complete profile</a>
          </div>`;
        summary.innerHTML = '<div class="empty-state">Complete your profile to start appearing in student search results.</div>';
      }
    } catch (err) {
      banner.innerHTML = `
        <div class="banner">
          <div class="banner-text">
            <strong>Complete your profile</strong>
            <span>Add your qualifications and location to start receiving bookings.</span>
          </div>
          <a href="teacher-complete-profile.html" class="btn btn-accent btn-sm">Complete profile</a>
        </div>`;
      summary.innerHTML = '<div class="empty-state">Complete your profile to start appearing in student search results.</div>';
    }
  }
  loadProfileSummary();

  // ---------- Incoming bookings ----------
  async function loadBookings() {
    const area = document.getElementById('bookingsArea');
    try {
      const bookings = await apiRequest('/api/bookings/teacher/me');

      if (bookings.length === 0) {
        area.innerHTML = '<div class="empty-state">No booking requests yet. They will appear here once a student books a demo class with you.</div>';
        return;
      }

      area.innerHTML = bookings.map(b => `
        <div class="request-row">
          <div class="request-info">
            <strong>${b.student_name}</strong> requested a ${b.type} class ${b.subject ? 'for ' + b.subject : ''}
            <br><span class="status-tag ${b.status}">${b.status}</span>
          </div>
          ${b.status === 'requested' ? `
            <div>
              <button class="btn btn-primary btn-sm" onclick="respondToBooking(${b.id}, 'accepted')">Accept</button>
              <button class="btn btn-outline btn-sm" onclick="respondToBooking(${b.id}, 'declined')">Decline</button>
            </div>` : ''}
        </div>
      `).join('');
    } catch (err) {
      area.innerHTML = '<div class="empty-state">No booking requests yet. They will appear here once a student books a demo class with you.</div>';
    }
  }

  async function respondToBooking(bookingId, status) {
    try {
      await apiRequest(`/api/bookings/${bookingId}/status`, 'PUT', { status });
      loadBookings();
    } catch (err) {
      alert('Could not update booking: ' + err.message);
    }
  }

  loadBookings();
</script>

</body>
</html>
