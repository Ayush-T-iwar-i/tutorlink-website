<!DOCTYPE html>
<html lang="en" data-role="login">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose a New Password — TutorLink</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="index.html" style="text-decoration:none;">
      <div class="brand"><span class="brand-mark"></span>Tutor<em>Link</em></div>
    </a>
    <div class="nav-links">
      <a href="login.html">Back to log in</a>
    </div>
  </div>
</nav>

<div class="auth-page">
  <div class="auth-side">
    <div class="side-top">
      <div class="eyebrow">Almost there</div>
      <h2>Choose a new password.</h2>
      <p>Pick something you haven't used before, and you'll be back in your account right away.</p>
    </div>
  </div>

  <div class="auth-form-wrap">
    <div class="auth-card">
      <h2>Set a new password</h2>
      <p class="subtitle">Enter your new password below.</p>

      <div id="msgBox" class="msg-box" role="alert"></div>

      <form id="resetForm" novalidate>
        <div class="form-group password-field">
          <label for="password">New password</label>
          <input type="password" id="password" required minlength="8" placeholder="At least 8 chars (uppercase, lowercase, number)" autocomplete="new-password">
          <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">👁️</button>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm new password</label>
          <input type="password" id="confirmPassword" required minlength="8" placeholder="Re-enter your password" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
          <span class="btn-label">Update password</span>
        </button>
      </form>

      <div class="auth-footer">
        <a href="login.html">Back to log in</a>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  const form = document.getElementById('resetForm');
  const msgBox = document.getElementById('msgBox');
  const submitBtn = document.getElementById('submitBtn');

  const token = new URLSearchParams(window.location.search).get('token');
  if (!token) {
    msgBox.className = 'msg-box error';
    msgBox.textContent = 'This reset link is missing its token. Please request a new one from the forgot-password page.';
    submitBtn.disabled = true;
  }

  const passwordInput = document.getElementById('password');
  document.getElementById('togglePassword').addEventListener('click', function () {
    const isHidden = passwordInput.type === 'password';
    passwordInput.type = isHidden ? 'text' : 'password';
    this.textContent = isHidden ? '🙈' : '👁️';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msgBox.className = 'msg-box';

    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (password.length < 8 || !/[A-Z]/.test(password) || !/[a-z]/.test(password) || !/[0-9]/.test(password)) {
      msgBox.className = 'msg-box error';
      msgBox.textContent = 'Password must be at least 8 characters and include uppercase, lowercase, and a number.';
      return;
    }
    if (password !== confirmPassword) {
      msgBox.className = 'msg-box error';
      msgBox.textContent = "Passwords don't match.";
      return;
    }

    submitBtn.disabled = true;
    submitBtn.classList.add('btn-loading');

    try {
      await apiRequest('/api/auth/reset-password', 'POST', { token, password });
      msgBox.className = 'msg-box success';
      msgBox.textContent = 'Password updated! Redirecting to log in...';
      setTimeout(() => { window.location.href = 'login.html'; }, 1200);
    } catch (err) {
      msgBox.className = 'msg-box error';
      msgBox.textContent = err.message;
      submitBtn.disabled = false;
      submitBtn.classList.remove('btn-loading');
    }
  });
</script>

</body>
</html>
