<!DOCTYPE html>
<html lang="en" data-role="login">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — TutorLink</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="index.html" style="text-decoration:none;">
      <div class="brand"><span class="brand-mark"></span>Tutor<em>Link</em></div>
    </a>
    <div class="nav-links">
      <a href="login.html">Back to log in</a>
    </div>
  </div>
</nav>

<div class="auth-page">
  <div class="auth-side">
    <div class="side-top">
      <div class="eyebrow">Account recovery</div>
      <h2>We'll get you back in, safely.</h2>
      <p>Enter the email on your account and we'll send a secure link to reset your password.</p>
    </div>

    <div class="radius-visual" aria-hidden="true">
      <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
        <circle class="ring" cx="150" cy="150" r="50"/>
        <circle class="ring" cx="150" cy="150" r="90"/>
        <circle class="ring" cx="150" cy="150" r="130"/>
        <circle class="tutor-pin" cx="185" cy="120" r="5"/>
        <circle class="tutor-pin" cx="118" cy="178" r="5"/>
        <circle class="tutor-pin out" cx="258" cy="78" r="5"/>
        <circle class="center-pin" cx="150" cy="150" r="7"/>
      </svg>
    </div>
    <div class="radar-caption">Secure &amp; simple</div>
  </div>

  <div class="auth-form-wrap">
    <div class="auth-card">
      <h2>Reset your password</h2>
      <p class="subtitle">We'll email you a link to choose a new one.</p>

      <div id="msgBox" class="msg-box" role="alert"></div>

      <form id="forgotForm" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="you@example.com" autocomplete="email">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
          <span class="btn-label">Send reset link</span>
        </button>
      </form>

      <div class="auth-footer">
        Remembered it? <a href="login.html">Log in</a>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  const form = document.getElementById('forgotForm');
  const msgBox = document.getElementById('msgBox');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msgBox.className = 'msg-box';

    if (!form.checkValidity()) {
      form.reportValidity();
      return;
    }

    const email = document.getElementById('email').value.trim();
    submitBtn.disabled = true;
    submitBtn.classList.add('btn-loading');

    try {
      await apiRequest('/api/auth/forgot-password', 'POST', { email });
    } catch (err) {
      // Intentionally not surfaced: whether or not the account exists,
      // we show the same message below. This avoids leaking which
      // emails are registered.
    }

    submitBtn.disabled = false;
    submitBtn.classList.remove('btn-loading');
    msgBox.className = 'msg-box success';
    msgBox.textContent = "If an account exists for that email, we've sent a reset link. Please check your inbox.";
    form.reset();
  });
</script>

</body>
</html>
