<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Verified Home Tutors — TutorLink</title>
<meta name="description" content="Browse verified home tutors on TutorLink — filter by subject, city, rating, and hourly fee.">
<link rel="canonical" href="https://tutorlink.com/teachers.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ---------------- Navbar ---------------- -->
<nav class="navbar" id="mainNav" role="navigation" aria-label="Main navigation">
  <div class="container">
    <a href="index.html" class="brand" aria-label="TutorLink home">
      <span class="brand-mark" aria-hidden="true"></span>
      Tutor<em>Link</em>
    </a>
    <div class="nav-links" id="navLinks">
      <a href="teachers.html" style="color:var(--primary); font-weight:700;" aria-current="page">Browse Teachers</a>
      <a href="index.html#how-it-works">How It Works</a>
      <a href="login.html" id="navLoginBtn">Log in</a>
      <a href="signup.html" class="btn btn-primary btn-sm" id="navSignupBtn">Sign up</a>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="navLinks">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<main class="dashboard-body">
  <div class="container">

    <div style="margin-bottom: 28px;">
      <div class="eyebrow">🎓 Tutor Directory</div>
      <h1 style="margin-bottom:8px;">Find the Perfect Home Tutor</h1>
      <p style="font-size:16px; color:var(--ink-500); max-width:640px;">
        Explore ID-verified tutors across your city. Click any tutor to view full qualifications, available slots, and book a free demo class.
      </p>
    </div>

    <!-- ---------------- Search & Filter Bar ---------------- -->
    <div class="filter-bar">
      <div class="form-group">
        <label for="subjectFilter">Subject</label>
        <input type="text" id="subjectFilter" placeholder="e.g. Mathematics, Physics, English">
      </div>
      <div class="form-group">
        <label for="cityFilter">City / Area</label>
        <input type="text" id="cityFilter" placeholder="e.g. Gurugram, Delhi, Meerut">
      </div>
      <div class="form-group">
        <label for="sortSelect">Sort by</label>
        <select id="sortSelect">
          <option value="rating">Highest Rated ★</option>
          <option value="fee_low">Fee: Low to High</option>
          <option value="fee_high">Fee: High to Low</option>
          <option value="experience">Most Experienced</option>
        </select>
      </div>
      <button id="searchBtn" class="btn btn-primary">Search Tutors</button>
    </div>

    <!-- ---------------- Results Area ---------------- -->
    <div id="resultsArea" aria-live="polite" aria-label="Teacher search results">
      <div class="teacher-grid"></div>
    </div>

    <!-- ---------------- Pagination ---------------- -->
    <nav style="display:flex; justify-content:center; align-items:center; gap:12px; margin-top:36px;" id="paginationArea" aria-label="Pagination"></nav>

  </div>
</main>

<!-- ---------------- Footer ---------------- -->
<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom" style="border:none; padding:0;">
      <span>© 2026 TutorLink. All rights reserved.</span>
      <span style="display:flex; gap:16px;">
        <a href="terms.html">Terms</a>
        <a href="privacy.html">Privacy</a>
        <a href="index.html">Home</a>
      </span>
    </div>
  </div>
</footer>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>
  let currentPage = 1;

  // Check URL query parameters for initial search
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('subject')) {
    document.getElementById('subjectFilter').value = urlParams.get('subject');
  }
  if (urlParams.get('city')) {
    document.getElementById('cityFilter').value = urlParams.get('city');
  }

  // Dynamic Navigation state
  const session = getSession();
  if (session && session.user) {
    const loginBtn = document.getElementById('navLoginBtn');
    const signupBtn = document.getElementById('navSignupBtn');
    const dashboardLink = session.user.role === 'teacher' ? 'teacher-dashboard.html'
      : session.user.role === 'admin' ? 'admin-dashboard.html'
      : 'student-dashboard.html';

    if (loginBtn) loginBtn.remove();
    if (signupBtn) {
      signupBtn.textContent = 'Dashboard';
      signupBtn.href = dashboardLink;
    }
  }

  function skeletons(n) {
    return `<div class="teacher-grid">${Array(n).fill(`
      <div class="skeleton-card">
        <div style="display:flex; gap:12px; align-items:center;">
          <div class="skel-avatar"></div>
          <div style="flex:1;">
            <div class="skel-line w-60" style="margin-bottom:6px;"></div>
            <div class="skel-line w-40"></div>
          </div>
        </div>
        <div class="skel-line w-80" style="margin:12px 0;"></div>
        <div class="skel-line w-40"></div>
      </div>`).join('')}</div>`;
  }

  async function loadTeachers(page = 1) {
    currentPage = page;
    const resultsArea = document.getElementById('resultsArea');
    resultsArea.innerHTML = skeletons(6);

    const subject = document.getElementById('subjectFilter').value.trim();
    const city = document.getElementById('cityFilter').value.trim();
    const sort = document.getElementById('sortSelect').value;

    try {
      let url = `/api/teachers/browse?sort=${sort}&page=${page}&limit=12`;
      if (subject) url += `&subject=${encodeURIComponent(subject)}`;
      if (city) url += `&city=${encodeURIComponent(city)}`;

      const data = await apiRequest(url);

      if (data.teachers.length === 0) {
        resultsArea.innerHTML = `
          <div class="empty-state">
            <div style="font-size:36px; margin-bottom:12px;">🔍</div>
            <h3 style="margin-bottom:6px;">No teachers found matching your filters</h3>
            <p>Try clearing your search terms or expanding your subject criteria.</p>
            <button class="btn btn-outline btn-sm" style="margin-top:12px;" onclick="clearFilters()">Reset Filters</button>
          </div>`;
        document.getElementById('paginationArea').innerHTML = '';
        return;
      }

      resultsArea.innerHTML = `<div class="teacher-grid">${data.teachers.map(renderCard).join('')}</div>`;
      renderPagination(data.page, data.total_pages);
    } catch (err) {
      resultsArea.innerHTML = `<div class="empty-state">${escapeHtml(err.message)}</div>`;
    }
  }

  function clearFilters() {
    document.getElementById('subjectFilter').value = '';
    document.getElementById('cityFilter').value = '';
    document.getElementById('sortSelect').value = 'rating';
    loadTeachers(1);
  }

  function renderCard(t) {
    const initials = t.name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
    const subjectsArray = (t.subjects || '').split(',').map(s => s.trim()).filter(Boolean);
    const displayedSubjects = subjectsArray.slice(0, 3).join(', ') + (subjectsArray.length > 3 ? ` +${subjectsArray.length - 3} more` : '');

    return `
      <div class="teacher-card" onclick="viewProfile(${t.id})" style="cursor:pointer;">
        <div>
          <div class="teacher-card-top">
            <div class="avatar">
              ${t.profile_photo ? `<img class="avatar-photo" src="${photoUrl(t.profile_photo)}" alt="${escapeHtml(t.name)}">` : initials}
            </div>
            <div>
              <h3>${escapeHtml(t.name)}</h3>
              <div class="meta">${escapeHtml(t.qualification) || 'Verified Educator'}</div>
              <div class="meta" style="margin-top:2px;">📍 ${escapeHtml(t.city) || 'Location on profile'}</div>
            </div>
          </div>

          <div class="badge-row">
            <span class="badge badge-rating">★ ${t.rating_avg > 0 ? Number(t.rating_avg).toFixed(1) : 'New'} (${t.total_reviews || 0})</span>
            <span class="badge badge-verified">✓ ID Verified</span>
            ${t.experience_years ? `<span class="badge badge-distance">${t.experience_years} yrs exp</span>` : ''}
          </div>

          <div style="font-size:13.5px; color:var(--ink-700); margin-bottom:14px; line-height:1.4;">
            <strong>Teaches:</strong> ${escapeHtml(displayedSubjects) || 'Subjects listed on profile'}
          </div>
        </div>

        <div>
          <div class="fee">₹${t.fee_per_hour || 0} <span>/ hr</span></div>
          <button class="btn btn-primary btn-block btn-sm">View Profile &amp; Book Demo</button>
        </div>
      </div>
    `;
  }

  function viewProfile(teacherId) {
    if (!getSession()) {
      window.location.href = `signup.html?role=student&redirect=teacher-profile-view.html?id=${teacherId}`;
      return;
    }
    window.location.href = `teacher-profile-view.html?id=${teacherId}`;
  }

  function renderPagination(page, totalPages) {
    const area = document.getElementById('paginationArea');
    if (totalPages <= 1) { area.innerHTML = ''; return; }
    let html = '';
    if (page > 1) html += `<button class="btn btn-outline btn-sm" onclick="loadTeachers(${page - 1})">← Previous</button>`;
    html += `<span class="status-pill">Page ${page} of ${totalPages}</span>`;
    if (page < totalPages) html += `<button class="btn btn-outline btn-sm" onclick="loadTeachers(${page + 1})">Next →</button>`;
    area.innerHTML = html;
  }

  document.getElementById('searchBtn').addEventListener('click', () => loadTeachers(1));
  ['subjectFilter', 'cityFilter'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') loadTeachers(1); });
  });
  document.getElementById('sortSelect').addEventListener('change', () => loadTeachers(1));

  loadTeachers(1);
</script>

</body>
</html>
