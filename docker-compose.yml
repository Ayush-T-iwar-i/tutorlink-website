services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tutorlink-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=db
      - DB_USER=tutorlink_user
      - DB_PASSWORD=tutorlink_secure_password
      - DB_NAME=tutorlink
      - JWT_SECRET=tutorlink_production_super_secret_jwt_key_32bytes
      - DEFAULT_RADIUS_KM=5
      - ALLOWED_ORIGIN=*
    volumes:
      - tutorlink_uploads:/app/backend/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: tutorlink-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root_secure_password
      - MYSQL_DATABASE=tutorlink
      - MYSQL_USER=tutorlink_user
      - MYSQL_PASSWORD=tutorlink_secure_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "tutorlink_user", "-ptutorlink_secure_password"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
    driver: local
  tutorlink_uploads:
    driver: local
